<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فلزیاب بلوتوثی - بدون اتصال</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at 50% 20%, #1a1f3a 0%, #050814 70%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    user-select: none;
  }

  h1 { font-size: 20px; margin-bottom: 8px; color: #4fc3f7; text-align: center; }
  .sub { font-size: 12px; color: #888; margin-bottom: 20px; text-align: center; }

  /* دایره رادار */
  .radar {
    position: relative;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle, rgba(79,195,247,0.15) 0%, rgba(79,195,247,0.02) 70%);
    border: 3px solid rgba(79,195,247,0.3);
    box-shadow: 0 0 40px rgba(79,195,247,0.2);
    transition: all 0.3s ease;
    margin-bottom: 20px;
  }

  .radar.hot {
    border-color: #ff1744;
    box-shadow: 0 0 70px rgba(255,23,68,0.7), inset 0 0 50px rgba(255,23,68,0.3);
    animation: pulse 0.3s infinite alternate;
  }
  .radar.warm {
    border-color: #ffab00;
    box-shadow: 0 0 60px rgba(255,171,0,0.6);
  }
  .radar.cold {
    border-color: #4fc3f7;
    box-shadow: 0 0 30px rgba(79,195,247,0.3);
  }

  @keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.06); }
  }

  .percent {
    font-size: 64px;
    font-weight: bold;
    color: #fff;
    text-shadow: 0 0 30px currentColor;
    line-height: 1;
  }
  .percent-sign { font-size: 24px; color: #aaa; }

  .label {
    font-size: 13px;
    color: #ccc;
    margin-top: 6px;
    text-align: center;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rssi-info {
    font-size: 12px;
    color: #666;
    margin-bottom: 15px;
    text-align: center;
  }

  /* نوار قدرت */
  .bar-wrap {
    width: 90%;
    max-width: 320px;
    height: 16px;
    background: #0f1428;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
    border: 1px solid #2a3050;
  }
  .bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4fc3f7, #00e676, #ffab00, #ff1744);
    transition: width 0.12s linear;
    border-radius: 8px;
  }

  .status {
    font-size: 13px;
    color: #aaa;
    text-align: center;
    min-height: 22px;
    margin-bottom: 15px;
  }

  button {
    background: linear-gradient(135deg, #4fc3f7, #2196f3);
    color: #fff;
    border: none;
    padding: 14px 36px;
    font-size: 15px;
    border-radius: 30px;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(79,195,247,0.4);
    margin: 5px;
  }
  button:active { transform: scale(0.95); }
  button.stop { background: linear-gradient(135deg, #ff1744, #d50000); }
  button:disabled { opacity: 0.4; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }

  /* لیست دستگاه‌ها */
  .device-list {
    width: 90%;
    max-width: 340px;
    max-height: 200px;
    overflow-y: auto;
    background: #0f1428;
    border-radius: 12px;
    margin-top: 15px;
    border: 1px solid #2a3050;
    display: none;
  }
  .device-list.show { display: block; }
  .device-item {
    padding: 12px 15px;
    border-bottom: 1px solid #1a1f3a;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
  .device-item:last-child { border-bottom: none; }
  .device-item:hover, .device-item.active { background: #1a1f3a; }
  .device-name { color: #4fc3f7; font-weight: bold; }
  .device-rssi { color: #888; font-size: 11px; }
  .device-item.active .device-name { color: #ff1744; }

  .info-box {
    font-size: 11px;
    color: #666;
    text-align: center;
    margin-top: 15px;
    line-height: 1.7;
    max-width: 340px;
  }
  .info-box a { color: #4fc3f7; }
</style>
</head>
<body>

<h1>📡 فلزیاب بلوتوثی</h1>
<div class="sub">بدون اتصال • فقط با سیگنال</div>

<div class="radar cold" id="radar">
  <div style="text-align:center;">
    <div class="percent" id="percentValue">--</div>
    <div class="label" id="deviceLabel">در انتظار</div>
  </div>
</div>

<div class="rssi-info" id="rssiInfo">RSSI: -- dBm</div>

<div class="bar-wrap"><div class="bar" id="bar"></div></div>

<div class="status" id="status">برای شروع دکمه رو بزن</div>

<div class="controls">
  <button id="startBtn">شروع اسکن</button>
  <button id="stopBtn" class="stop" style="display:none;">توقف</button>
</div>

<div class="device-list" id="deviceList"></div>

<div class="info-box">
  برای دقت بالاتر، اپلیکیشن <b>HD BLE Analyzer</b> یا <b>Bluetooth Radar</b> رو نصب کن.<br>
  مرورگر محدودیت داره ولی این کد بهترین تلاش رو می‌کنه.
</div>

<script>
// ============ تنظیمات ============
const RSSI_NEAR = -40;   // خیلی نزدیک
const RSSI_FAR  = -100;  // خیلی دور
const BEEP_MIN_MS = 50;   // سریع‌ترین بوق
const BEEP_MAX_MS = 1500; // کندترین بوق
const SMOOTH = 5;         // میانگین‌گیری
const TARGET_LOST_MS = 4000; // بعد از این مدت بی‌سیگنالی، هدف عوض شه

// ============ متغیرها ============
let scan = null;
let isRunning = false;
let beepTimer = null;
let selectedDeviceId = null;
let devices = new Map(); // id -> {name, rssiHistory, lastRssi, lastSeen}
let audioCtx = null;

// ============ Audio ============
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playBeep(freq, dur, vol) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// ============ UI ============
const radarEl = document.getElementById('radar');
const percentEl = document.getElementById('percentValue');
const labelEl = document.getElementById('deviceLabel');
const rssiInfoEl = document.getElementById('rssiInfo');
const barEl = document.getElementById('bar');
const statusEl = document.getElementById('status');
const deviceListEl = document.getElementById('deviceList');
const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');

function rssiToPercent(rssi) {
  const c = Math.max(RSSI_FAR, Math.min(RSSI_NEAR, rssi));
  return (c - RSSI_FAR) / (RSSI_NEAR - RSSI_FAR);
}

function updateUI(deviceId) {
  const d = devices.get(deviceId);
  if (!d) return;

  const avg = d.rssiHistory.reduce((a,b)=>a+b,0) / d.rssiHistory.length;
  const p = rssiToPercent(avg);
  const percent = Math.round(p * 100);

  percentEl.textContent = percent;
  labelEl.textContent = d.name || '(بی‌نام)';
  rssiInfoEl.textContent = `RSSI: ${avg.toFixed(1)} dBm`;
  barEl.style.width = percent + '%';

  radarEl.classList.remove('hot','warm','cold');
  if (p > 0.66) { radarEl.classList.add('hot'); statusEl.textContent = '🔥 خیلی نزدیک!'; }
  else if (p > 0.33) { radarEl.classList.add('warm'); statusEl.textContent = '🌤 نزدیک'; }
  else { radarEl.classList.add('cold'); statusEl.textContent = '❄️ دور'; }

  // بروزرسانی لیست
  renderDeviceList();
}

function renderDeviceList() {
  if (devices.size === 0) return;
  deviceListEl.classList.add('show');
  const sorted = [...devices.entries()].sort((a,b) => {
    const ra = a[1].rssiHistory.reduce((x,y)=>x+y,0)/a[1].rssiHistory.length;
    const rb = b[1].rssiHistory.reduce((x,y)=>x+y,0)/b[1].rssiHistory.length;
    return rb - ra;
  });

  deviceListEl.innerHTML = sorted.map(([id, d]) => {
    const avg = (d.rssiHistory.reduce((x,y)=>x+y,0)/d.rssiHistory.length).toFixed(1);
    const active = id === selectedDeviceId ? ' active' : '';
    return `<div class="device-item${active}" data-id="${id}">
      <span class="device-name">${d.name || '(بی‌نام)'}</span>
      <span class="device-rssi">${avg} dBm</span>
    </div>`;
  }).join('');

  deviceListEl.querySelectorAll('.device-item').forEach(el => {
    el.addEventListener('click', () => {
      selectedDeviceId = el.dataset.id;
      const d = devices.get(selectedDeviceId);
      if (d) {
        d.rssiHistory = [];
        d.lastSeen = Date.now();
      }
      updateUI(selectedDeviceId);
      statusEl.textContent = '🎯 هدف انتخاب شد';
    });
  });
}

// ============ حلقه بوق ============
function beepLoop() {
  if (!isRunning || !selectedDeviceId) {
    beepTimer = setTimeout(beepLoop, 500);
    return;
  }

  const d = devices.get(selectedDeviceId);
  if (!d || Date.now() - d.lastSeen > TARGET_LOST_MS) {
    beepTimer = setTimeout(beepLoop, 500);
    return;
  }

  const avg = d.rssiHistory.reduce((a,b)=>a+b,0) / d.rssiHistory.length;
  const p = rssiToPercent(avg);
  const interval = BEEP_MAX_MS - p * (BEEP_MAX_MS - BEEP_MIN_MS);

  let freq, vol, dur;
  if (p > 0.66) { freq = 1300; vol = 0.5; dur = 0.05; }
  else if (p > 0.33) { freq = 950; vol = 0.4; dur = 0.07; }
  else { freq = 650; vol = 0.3; dur = 0.09; }

  playBeep(freq, dur, vol);
  if (navigator.vibrate && p > 0.5) navigator.vibrate(Math.round(p * 40));

  beepTimer = setTimeout(beepLoop, interval);
}

// ============ Bluetooth Scan ============
async function startScan() {
  if (!navigator.bluetooth) {
    alert('مرورگرت Web Bluetooth رو پشتیبانی نمی‌کنه!\nاز Chrome اندروید استفاده کن.');
    return;
  }

  try {
    initAudio();
    statusEl.textContent = 'در حال اسکن...';
    startBtn.disabled = true;

    // تلاش برای LE Scan (بدون اتصال)
    if (navigator.bluetooth.requestLEScan) {
      scan = await navigator.bluetooth.requestLEScan({
        acceptAllAdvertisements: true,
        keepRepeatedDevices: true
      });

      navigator.bluetooth.addEventListener('advertisementreceived', onAdvertisement);
      statusEl.textContent = 'اسکن فعاله...';
      isRunning = true;
      startBtn.style.display = 'none';
      stopBtn.style.display = 'inline-block';
      beepLoop();
      return;
    }

    // fallback: اگه requestLEScan نبود، از requestDevice استفاده کن
    // ولی اینبار بدون اتصال، فقط برای دسترسی به advertisement
    statusEl.textContent = 'حالت جایگزین...';
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: ['generic_access']
    });

    devices.set(device.id, {
      name: device.name || '(بی‌نام)',
      rssiHistory: [],
      lastRssi: -100,
      lastSeen: Date.now()
    });

    device.addEventListener('advertisementreceived', (e) => {
      handleAdvertisement(device.id, device.name, e.rssi);
    });

    // watchAdvertisements بدون اتصال
    if (device.watchAdvertisements) {
      await device.watchAdvertisements();
    }

    selectedDeviceId = device.id;
    isRunning = true;
    startBtn.style.display = 'none';
    stopBtn.style.display = 'inline-block';
    beepLoop();

  } catch (err) {
    console.error(err);
    statusEl.textContent = 'خطا: ' + err.message;
    startBtn.disabled = false;
  }
}

function onAdvertisement(e) {
  const device = e.device;
  if (!device) return;
  handleAdvertisement(device.id, device.name, e.rssi);
}

function handleAdvertisement(id, name, rssi) {
  if (!devices.has(id)) {
    devices.set(id, { name, rssiHistory: [], lastRssi: -100, lastSeen: Date.now() });
  }
  const d = devices.get(id);
  d.name = name || d.name;
  d.rssiHistory.push(rssi);
  if (d.rssiHistory.length > SMOOTH) d.rssiHistory.shift();
  d.lastRssi = rssi;
  d.lastSeen = Date.now();

  // اگه هنوز هدف انتخاب نشده، قوی‌ترین دستگاه رو انتخاب کن
  if (!selectedDeviceId) {
    selectedDeviceId = id;
    statusEl.textContent = '🎯 هدف خودکار انتخاب شد';
  }

  if (id === selectedDeviceId) updateUI(id);
  else renderDeviceList();
}

function stopScan() {
  isRunning = false;
  if (beepTimer) { clearTimeout(beepTimer); beepTimer = null; }

  if (scan) {
    try { scan.stop(); } catch(e) {}
    navigator.bluetooth.removeEventListener('advertisementreceived', onAdvertisement);
    scan = null;
  }

  selectedDeviceId = null;
  devices.clear();
  percentEl.textContent = '--';
  labelEl.textContent = 'در انتظار';
  rssiInfoEl.textContent = 'RSSI: -- dBm';
  barEl.style.width = '0%';
  radarEl.classList.remove('hot','warm');
  radarEl.classList.add('cold');
  deviceListEl.classList.remove('show');
  statusEl.textContent = 'متوقف شد';
  startBtn.style.display = 'inline-block';
  startBtn.disabled = false;
  stopBtn.style.display = 'none';
}

startBtn.addEventListener('click', startScan);
stopBtn.addEventListener('click', stopScan);

// نگه داشتن صفحه روشن
if ('wakeLock' in navigator) {
  navigator.wakeLock.request('screen').catch(()=>{});
}
</script>
</body>
</html>
